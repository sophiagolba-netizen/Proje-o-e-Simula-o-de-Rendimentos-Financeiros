<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeção de Rendimentos Financeiros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Simulador de Projeção Financeira</h1>
            <p>Acompanhe a evolução do seu salário, reservas e rendimentos ao longo dos anos.</p>
        </header>

        <div class="table-container">
            <table id="financialTable">
                <thead>
                    <tr>
                        <th>Ano</th>
                        <th>Idade</th>
                        <th>Salário</th>
                        <th>Reserva Anual</th>
                        <th>Valor Inicial</th>
                        <th>Rendimento</th>
                        <th class="highlight-header">Valor Final</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Os dados serão inseridos dinamicamente via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
